
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consommation STEG - Denden</title>

    <!-- Bibliothèque pour lire les fichiers Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f7fa;
        }

        h1 {
            color: #176b45;
        }

        #message {
            margin: 15px 0;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #176b45;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f0f5f2;
        }
    </style>
</head>

<body>

    <h1>Consommation STEG - Denden</h1>

    <p>Les données sont chargées depuis le fichier Excel hébergé sur GitHub.</p>

    <p id="message">Chargement des données...</p>

    <div class="table-container">
        <table id="tableau">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function chargerDonneesExcel() {
            const urlExcel =
                "Consommation-STEG-DenDen.xlsx";

            const message = document.getElementById("message");

            try {
                const reponse = await fetch(urlExcel);

                if (!reponse.ok) {
                    throw new Error("Erreur HTTP : " + reponse.status);
                }

                const contenu = await reponse.arrayBuffer();

                const classeur = XLSX.read(contenu, {
                    type: "array"
                });

                const nomFeuille = classeur.SheetNames[0];
                const feuille = classeur.Sheets[nomFeuille];

                const donnees = XLSX.utils.sheet_to_json(feuille, {
                    header: 1,
                    defval: ""
                });

                if (donnees.length === 0) {
                    message.textContent = "Le fichier Excel est vide.";
                    return;
                }

                // Première ligne : noms des colonnes
                const entetes = donnees[0];
                const lignes = donnees.slice(1);

                const thead = document.querySelector("#tableau thead");
                const tbody = document.querySelector("#tableau tbody");

                // Afficher les en-têtes
                const ligneEntetes = document.createElement("tr");

                entetes.forEach(entete => {
                    const th = document.createElement("th");
                    th.textContent = entete;
                    ligneEntetes.appendChild(th);
                });

                thead.appendChild(ligneEntetes);

                // Afficher les données
                lignes.forEach(ligne => {
                    const tr = document.createElement("tr");

                    entetes.forEach((_, index) => {
                        const td = document.createElement("td");
                        td.textContent = ligne[index] ?? "";
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });

                message.textContent =
                    "Chargement réussi : " + lignes.length + " lignes affichées.";

                console.log("Feuille utilisée :", nomFeuille);
                console.log("Données Excel :", donnees);

            }  catch (erreur) {
    console.error("Erreur de chargement :", erreur);

    message.textContent =
        "Erreur : " + erreur.message;
        }
        }

        chargerDonneesExcel();
    </script>

</body>
</html>
